spring.application.name=magalu-ai-optimizer

# Banco H2 salvo em arquivo local (./data/magaludb)
spring.datasource.url=jdbc:h2:file:./data/magaludb;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Opcional: se deixar vazio, o sistema usa o fallback local para testes offline
ai.api.key=${AI_API_KEY:}
